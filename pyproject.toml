[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuktara-thread"
version = "0.4.0.dev0"
description = "Local-first project continuity and handover packages"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Yuktara Technologies" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
desktop = ["PySide6>=6.7,<6.10"]

[project.scripts]
thread = "yuktara_thread.cli.main:main"
thread-desktop = "yuktara_thread.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
