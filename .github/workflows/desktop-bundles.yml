name: Desktop Bundles

on:
  workflow_dispatch:
  push:
    branches:
      - "dev/**"
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name YuktaraThread --paths src --collect-all PySide6 --collect-all shiboken6 scripts/desktop_entry.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/YuktaraThread/* -DestinationPath yuktara-thread-windows.zip
          $hash = (Get-FileHash yuktara-thread-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  yuktara-thread-windows.zip" | Set-Content yuktara-thread-windows.zip.sha256
      - if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/YuktaraThread.app yuktara-thread-macos.zip
          shasum -a 256 yuktara-thread-macos.zip > yuktara-thread-macos.zip.sha256
      - if: runner.os == 'Linux'
        run: |
          tar -czf yuktara-thread-linux.tar.gz -C dist YuktaraThread
          sha256sum yuktara-thread-linux.tar.gz > yuktara-thread-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: yuktara-thread-${{ runner.os }}
          path: |
            yuktara-thread-*.zip
            yuktara-thread-*.tar.gz
            yuktara-thread-*.sha256
          if-no-files-found: error
